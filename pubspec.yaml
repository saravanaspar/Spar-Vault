name: spar_vault
description: Spar Vault, a local-first password vault with a nonrecoverable random master key.
publish_to: none
version: 0.2.1+4
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  vault_core:
    path: packages/vault_core
  file_picker: 13.1.0
  file_picker_web: 4.0.1
  path_provider: 2.1.6
  web: 1.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  fonts:
    # CanvasKit requires a registered Roboto fallback. Alias our bundled
    # DejaVu font so both debug and release builds avoid a network font fetch.
    - family: Roboto
      fonts:
        - asset: assets/fonts/DejaVuSans.ttf
    - family: LocalSans
      fonts:
        - asset: assets/fonts/DejaVuSans.ttf
        - asset: assets/fonts/DejaVuSans-Bold.ttf
          weight: 700
    - family: LocalMono
      fonts:
        - asset: assets/fonts/DejaVuSansMono.ttf
