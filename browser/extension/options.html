<!doctype html><html><head><meta charset="utf-8"><title>Spar Vault integration</title><link rel="stylesheet" href="style.css"></head><body><h2>Spar Vault integration</h2><p>Extension ID: <code id="id"></code></p><p>Put this ID in Spar Vault → Settings → Autofill.</p><label>Connection <select id="mode"><option value="native">Desktop app (Linux / Windows)</option><option value="web">Open web vault tab</option></select></label><label>Web vault URL <input id="url" type="url" placeholder="https://your-vault.example/"></label><button id="save">Save connection</button><p id="status"></p><p>Web mode grants access only to your selected vault origin. Fill requests use the current login tab and require approval. No passwords are stored in this extension.</p><script src="options.js"></script></body></html>
